<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="connexion.css">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Connexion</title>
</head>
<body>
    <form action="#" method="POST">
        <section>
            <!------------Connexion---------------------------->
            <div class="connexion">
                <div class="text">
                    <h2>Connexion</h2>
                    <div>
                        <a href="Restau.html"><i class="fa-solid fa-xmark"></i></a>
                    </div>
                </div>
                <div>
                    <div class="inp1">
                            <label for="nomU1">Nom d'utilisateur</label>
                            <input type="text" id="nomU1">
                    </div>
                    <div class="inp1">
                            <label for="mtpasse1">Mot de passe</label>
                            <input type="password" id="mtpasse1">
                    </div>
                </div>
                <div class="bouton">
                    <a href="Restau.html"><button class="input">Connecter</button>></a>
                    
                </div>
                <div class="forget">
                    <p class="mot">S'inscrire<br/>Mot de passe oublié</p>
                </div>
            </div>
            <!---------------Inscription--------------------------->
            <div class="formulaire1">
                <div class="text">
                    <h2> Inscription </h2>
                    <div>
                        <a href="Restau.html"><i class="fa-solid fa-xmark"></i></a>
                    </div>
                </div>
                <div class="part">
                    <div class="formulaire-part">
                        <div class="inp1">
                            <label for="nom">Nom</label>
                            <input type="text" id="nom" placeholder="Sekongo">
                        </div>
                        <div class="inp1">
                            <label for="nomU">Nom d'utilisateur</label>
                            <input type="text" id="nomU" placeholder="moussasekongo01">
                        </div>
                        <div class="inp1">
                            <label for="email">Email</label>
                            <input type="mail" id="email" placeholder="sekongo25@gmail.com">
                        </div>
                        <div class="inp1">
                            <label for="mtpasse">Mot de passe</label>
                            <input type="password" id="mtpasse">
                        </div>
                    </div>
                    <div class="formulaire-part">
                        <div class="inp1">
                            <label for="pnom">Prenom</label>
                            <input type="text" id="pnom" placeholder="Moussa">
                        </div>
                        <div class="inp1">
                            <label for="tel">Contact</label>
                            <input type="text" id="tel" value="+225 ">
                        </div>
                        <div class="inp1">
                            <label for="Naiss">Date de Naissance</label>
                            <input type="date" id="Naiss">
                        </div>
                        <div class="inp1">
                            <label for="Cpasse">Confirmer le Mot de passe</label>
                            <input type="password" id="Cpasse">
                        </div>
                    </div>
                </div>
                <div class="genre">
                    <p>Genre</p>
                    <div class="sexe">
                        <div>
                            <label for="Ma">Masculin</label>
                            <input type="radio" value="masculin" name="genre" id="Ma">
                        </div>
                        <div>
                            <label for="Fe">feminin</label>
                            <input type="radio" value="feminin" name="genre" id="Fe">
                        </div>
                    </div>
                </div>
                <div class="enregistrer">
                    <button class="inscrit">Enregistrer</button>
                   
                </div>
            </div>
        </section>


    </form>

    <script src="connexion.js">    </script>
</body>
</html>
